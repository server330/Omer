<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عمر عماد الشيخ أحمد | البطاقة التعريفية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #090d16 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            padding: 35px 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(56, 189, 248, 0.2);
        }

        .profile-img-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
        }

        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            color: #fff;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .name {
            font-size: 1.65rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .nickname {
            font-size: 1.05rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: right;
        }

        .info-item {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .info-item:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.35);
        }

        .info-label {
            color: #94a3b8;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .info-value {
            color: #f1f5f9;
            font-size: 0.98rem;
            font-weight: 700;
        }

        .blood-type {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 2px 12px;
            border-radius: 8px;
            font-weight: 900;
            direction: ltr;
        }

        .footer {
            margin-top: 26px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img-container">
            <!-- تأكد من تسمية ملف الصورة بنفس هذا الاسم في GitHub -->
            <img src="profile.jpg" alt="عمر عماد الشيخ أحمد" class="profile-img">
        </div>

        <span class="badge">وزير الشباب</span>
        <h1 class="name">عمر عماد الشيخ أحمد</h1>
        <p class="nickname">اللقب: عمر الجوكس</p>

        <div class="info-grid">
            <div class="info-item">
                <span class="info-label">الجامعة</span>
                <span class="info-value">الجامعة التكنولوجية</span>
            </div>

            <div class="info-item">
                <span class="info-label">المجال الأكاديمي</span>
                <span class="info-value">سنيور تقانة معلومات وعلوم حاسوب</span>
            </div>

            <div class="info-item">
                <span class="info-label">المهنة / المنصب</span>
                <span class="info-value">وزير الشباب</span>
            </div>

            <div class="info-item">
                <span class="info-label">فصيلة الدم</span>
                <span class="blood-type">B+</span>
            </div>
        </div>

        <div class="footer">
            تم التصميم والتطوير بواسطة عمر الجوكس &copy; 2026
        </div>
    </div>

</body>
</html>
